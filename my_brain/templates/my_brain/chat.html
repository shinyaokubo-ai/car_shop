<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慎也の分身ボット（マルチモーダル）</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        #chat-box { max-width: 600px; margin: auto; background: white; border-radius: 12px; height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 15px; padding: 10px 15px; border-radius: 18px; max-width: 80%; line-height: 1.4; white-space: pre-wrap; }
        .user { align-self: flex-end; background: #0084ff; color: white; margin-left: auto; }
        .bot { align-self: flex-start; background: #e4e6eb; color: black; }
        #input-area { display: flex; flex-direction: column; padding: 15px; border-top: 1px solid #ddd; gap: 10px; }
        .input-row { display: flex; gap: 10px; }
        #user-input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; outline: none; }
        #file-input { font-size: 0.8em; }
        button { background: #0084ff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        button:hover { background: #0073e6; }
    </style>
</head>
<body>

<div id="chat-box">
    <div id="messages">
        <div class="msg bot">慎也です。画像も送れるようになりました。スパイスの相談でも何でもどうぞ。</div>
    </div>
    <div id="input-area">
        <input type="file" id="file-input" accept="image/*,application/pdf">
        <div class="input-row">
            <input type="text" id="user-input" placeholder="メッセージを入力...">
            <button onclick="send()">送信</button>
        </div>
    </div>
</div>

<script>
    async function send() {
        const input = document.getElementById('user-input');
        const fileInput = document.getElementById('file-input');
        const text = input.value.trim();
        const file = fileInput.files[0];

        if (!text && !file) return;

        // ユーザーの送信メッセージを画面に表示
        appendMsg('user', text + (file ? `\n(ファイルを送信中: ${file.name})` : ''));
        input.value = '';
        fileInput.value = ''; // 送信後にクリア

        // データをまとめる
        const formData = new FormData();
        formData.append('message', text);
        if (file) {
            formData.append('file', file);
        }

        try {
            // 🌟バックエンドへ送信（JSONを待つのではなく、そのままfetchする）
            const response = await fetch('/my_brain/api/chat/', {
                method: 'POST',
                body: formData
            });

            // 🌟パラパラ処理スタート
            // 1. AIの空の吹き出しを先に作る
            const aiDiv = document.createElement('div');
            aiDiv.className = 'msg bot'; // 大久保さんのCSSクラス名「bot」を指定
            aiDiv.innerText = "慎也思考中..."; 
            document.getElementById('messages').appendChild(aiDiv);
            
            const box = document.getElementById('messages');
            box.scrollTop = box.scrollHeight;

            // 2. 届いたデータをパラパラ読み込む準備
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let isFirstChunk = true;

            // 3. ループして1文字ずつ画面に追加していく！
            while (true) {
                const { done, value } = await reader.read();
                if (done) break; // 全部終わったらストップ

                const chunk = decoder.decode(value, { stream: true });

                // 最初の文字が届いたら「慎也思考中...」の文字を消す
                if (isFirstChunk) {
                    aiDiv.innerText = "";
                    isFirstChunk = false;
                }

                aiDiv.innerText += chunk; // 届いた文字を追加！
                box.scrollTop = box.scrollHeight; // 常に一番下にスクロール
            }

        } catch (e) {
            // エラー処理
            appendMsg('bot', '通信エラーが発生しました。');
        }
    }

    // ユーザー側のメッセージを表示するお馴染みの関数
    function appendMsg(sender, text) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        document.getElementById('messages').appendChild(div);
        const box = document.getElementById('messages');
        box.scrollTop = box.scrollHeight;
    }

    // Enterキーで送信
    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { send(); }
    });
</script>
</body>
</html>
