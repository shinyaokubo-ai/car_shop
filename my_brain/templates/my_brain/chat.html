<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慎也の分身ボット</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        #chat-box { max-width: 600px; margin: auto; background: white; border-radius: 12px; height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 15px; padding: 10px 15px; border-radius: 18px; max-width: 80%; line-height: 1.4; }
        .user { align-self: flex-end; background: #0084ff; color: white; margin-left: auto; }
        .bot { align-self: flex-start; background: #e4e6eb; color: black; }
        #input-area { display: flex; padding: 15px; border-top: 1px solid #ddd; }
        #user-input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; outline: none; }
        button { background: #0084ff; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-box">
    <div id="messages">
        <div class="msg bot">慎也です。スパイスや自炊、身体作りについて語りましょう。</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="メッセージを入力...">
        <button onclick="send()">送信</button>
    </div>
</div>

<script>
    async function send() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMsg('user', text);
        input.value = '';

        const res = await fetch('/my_brain/api/chat/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text})
        });
        const data = await res.json();
        appendMsg('bot', data.reply || data.error);
    }

    function appendMsg(sender, text) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    // 入力欄でエンターキーが押された時の処理
// 入力欄でエンターキーが押された時の処理
document.getElementById('user-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        send(); // ⭕️ 正しい関数名に修正
    }
});




</script>
</body>
</html>
