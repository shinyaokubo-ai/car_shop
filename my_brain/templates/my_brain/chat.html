{% load static %} <!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#0084ff">
    
    <link rel="manifest" href="{% static 'my_brain/manifest.json' %}">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('{% static "my_brain/service-worker.js" %}');
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慎也の分身ボット（爆速ストリーミング版）</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        #chat-box { max-width: 600px; margin: auto; background: white; border-radius: 12px; height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 15px; padding: 10px 15px; border-radius: 18px; max-width: 80%; line-height: 1.4; white-space: pre-wrap; transition: all 0.3s ease; }
        .user { align-self: flex-end; background: #0084ff; color: white; margin-left: auto; }
        .bot { align-self: flex-start; background: #e4e6eb; color: black; }
        
        /* 🌟 追加：思考中アニメーションの魔法（CSS） */
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.4; transform: scale(0.98); }
        }
        .thinking {
            animation: pulse 1.5s infinite ease-in-out;
            color: #666;
            font-style: italic;
            background: #f8f9fa; /* 少し薄い色にして「考え中」感を出す */
            border: 1px dashed #ccc;
        }

        #input-area { display: flex; flex-direction: column; padding: 15px; border-top: 1px solid #ddd; gap: 10px; }
        .input-row { display: flex; gap: 10px; }
        #user-input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; outline: none; }
        #file-input { font-size: 0.8em; }
        button { background: #0084ff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0073e6; }
    </style>


    <link rel="manifest" href="/static/my_brain/manifest.json">
   
</head>
<body>

<div id="chat-box">
    <div id="messages">
        <div class="msg bot">慎也です。SSEストリーミングを導入して爆速になりました。何かあればどうぞ。</div>
    </div>
    <div id="input-area">
        <input type="file" id="file-input" accept="image/*,application/pdf">
        <div class="input-row">
            <input type="text" id="user-input" placeholder="メッセージを入力...">
            <button onclick="send()">送信</button>
        </div>
    </div>
</div>

<script>
    async function send() {
        const input = document.getElementById('user-input');
        const fileInput = document.getElementById('file-input');
        const text = input.value.trim();
        const file = fileInput.files[0];

        if (!text && !file) return;

        // ユーザーの質問を表示
        appendMsg('user', text + (file ? `\n(ファイルを送信中: ${file.name})` : ''));
        input.value = '';
        fileInput.value = ''; 

        const formData = new FormData();
        formData.append('message', text);
        if (file) {
            formData.append('file', file);
        }

        try {
            // 🌟 追加：AIの吹き出しに「thinking」クラスを付けてアニメーション開始！
            const aiDiv = document.createElement('div');
            aiDiv.className = 'msg bot thinking'; // ← ここがポイント！
            aiDiv.innerText = "慎也思考中..."; 
            document.getElementById('messages').appendChild(aiDiv);
            
            const box = document.getElementById('messages');
            box.scrollTop = box.scrollHeight;

            // fetch 開始
            const response = await fetch('/my_brain/api/chat/', {
                method: 'POST',
                body: formData
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let isFirstChunk = true;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break; 
                
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split("\n");
                
                for (const line of lines) {
                    if (line.startsWith("data: ")) {
                        try {
                            const data = JSON.parse(line.replace("data: ", ""));
                            
                            // 🌟 追加：最初の文字が来たらアニメーションを解除！
                            if (isFirstChunk) {
                                aiDiv.classList.remove('thinking'); // アニメーションクラスを外す
                                aiDiv.innerText = ""; // 「慎也思考中...」の文字を消す
                                isFirstChunk = false;
                            }
                            
                            aiDiv.innerText += data.text; // 1文字ずつパラパラ表示！
                            box.scrollTop = box.scrollHeight; 
                        } catch (e) {
                            // 不完全なJSONは無視
                        }
                    }
                }
            }

        } catch (e) {
            appendMsg('bot', 'システムエラー：通信が途絶えました。');
        }
    }

    function appendMsg(sender, text) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        document.getElementById('messages').appendChild(div);
        const box = document.getElementById('messages');
        box.scrollTop = box.scrollHeight;
    }

    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { send(); }
    });
</script>
</body>
</html>
