<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>在庫一覧 | 管理画面</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f4f5f7; color: #333; display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background-color: #1e293b; color: #fff; padding: 20px 0; }
        .sidebar-logo { text-align: center; margin-bottom: 40px; font-weight: bold; }
        .menu-item { padding: 15px 25px; color: #cbd5e1; display: block; text-decoration: none; }
        .menu-item.active { background-color: #334155; border-left: 3px solid #cc0000; color: #fff; }
        .main-content { flex-grow: 1; padding: 40px; }
        .page-header { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .btn-add { background: #cc0000; color: #fff; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: bold; }
        .table-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; text-align: left; padding: 15px; color: #64748b; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .status-new { background: #fee2e2; color: #991b1b; } .status-sale { background: #dcfce7; color: #166534; }
        .btn-icon { padding: 6px 10px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-logo">Admin Panel</div>
    <a href="#" class="menu-item active">在庫一覧</a>
    <a href="admin_register.html" class="menu-item">新規登録</a>
</aside>
<main class="main-content">
    <div class="page-header"><h1>在庫一覧</h1><a href="admin_register.html" class="btn-add">＋ 新規登録</a></div>
    <div class="table-card">
        <table>
            <thead><tr><th>画像</th><th>車両名</th><th>価格</th><th>ステータス</th><th>操作</th></tr></thead>
            <tbody>
                <tr>
                    <td><img src="https://images.unsplash.com/photo-1503376763036-066120622c74?w=50" style="border-radius:4px;"></td>
                    <td>ポルシェ カイエン GTS<br><span style="font-size:11px;color:#999;">SKU: C-001</span></td>
                    <td>¥2,980,000</td>
                    <td><span class="status-badge status-new">NEW</span></td>
                    <td><button class="btn-icon">編集</button> <button class="btn-icon" onclick="alert('削除')">削除</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
