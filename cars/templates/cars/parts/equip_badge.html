{% if has_item %}
<div class="d-flex align-items-center justify-content-center p-2 rounded border border-primary bg-primary bg-opacity-10 text-primary fw-bold" style="font-size: 0.9rem;">
    <i class="bi bi-check-circle-fill me-1"></i> {{ label }}
</div>
{% else %}
<div class="d-flex align-items-center justify-content-center p-2 rounded border bg-light text-muted" style="font-size: 0.9rem; opacity: 0.4;">
    <i class="bi bi-dash me-1"></i> {{ label }}
</div>
{% endif %}
