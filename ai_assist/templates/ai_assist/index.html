<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI在庫登録アシスト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">🚗 AI在庫登録アシスト</h1>
        
        <div class="card shadow-sm p-4 mb-4">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">スクショを複数選択（基本情報・スペック・装備など）</label>
                    <input type="file" name="upload_images" class="form-control" accept="image/*" multiple required>
                </div>
                <button type="submit" class="btn btn-primary w-100">AIに読み取らせる</button>
            </form>
        </div>

        {% if result %}
        <div class="card shadow-sm p-4 bg-white">
            <h5 class="mb-3">📋 AI解析結果の確認</h5>
            <table class="table table-bordered">
                <thead class="table-light">
                    <tr><th>項目</th><th>読み取り内容</th></tr>
                </thead>
                <tbody>
                    {% for key, value in result.items %}
                    <tr>
                        <td>{{ key }}</td>
                        <td><span class="badge {% if value == True %}bg-success{% elif value == False %}bg-secondary{% else %}bg-info text-dark{% endif %}">{{ value }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="json_data" value="{{ raw_json }}">
                <button type="submit" name="save_data" class="btn btn-success btn-lg w-100 mt-3">✅ この内容でデータベースに登録する</button>
            </form>
        </div>
        {% endif %}
    </div>
</body>
</html>
