<!DOCTYPE html>
<html lang="ja">
<head>

    <title>登録完了！</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5 text-center">
        <div class="card shadow p-5">
            <h1 class="text-success mb-4">🎉 登録が完了しました！</h1>
            <p class="lead">車名：<strong>{{ car.title }}</strong></p>
            <p class="text-muted">管理番号：{{ car.sku }}</p>
            <hr>
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center mt-4">
                <a href="{% url 'ai_assist:index' %}" class="btn btn-primary btn-lg px-4">次の車を解析する</a>
                <a href="/admin/cars/car/" class="btn btn-outline-secondary btn-lg px-4" target="_blank">管理画面で確認</a>
            </div>
        </div>
    </div>
</body>
</html>
